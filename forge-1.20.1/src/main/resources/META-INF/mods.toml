modLoader="javafml" #mandatory
loaderVersion="${loader_version_range}" #mandatory
license="${mod_license}"
issueTrackerURL="https://github.com/NoiiLive/hahueuh/issues"

[[mods]] #mandatory
modId="${mod_id}" #mandatory
version="${mod_version}" #mandatory
displayName="${mod_name}" #mandatory
displayURL="https://www.curseforge.com/minecraft/mc-mods/hah-ueuh"
credits="Noiilive (Developer), Tappei Nagatsuki (Re:Zero Author)"
authors="${mod_authors}"

[[mixins]]
config="${mod_id}.mixins.json"

description='''${mod_description}'''

[[dependencies.${mod_id}]] #mandatory
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
